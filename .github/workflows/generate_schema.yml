name: Generate db/schema.rb

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - feat/crm-pipelines

jobs:
  generate-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create database
        run: bundle exec rake db:create

      - name: Load the committed schema
        run: bundle exec rake db:schema:load

      - name: Run pending migrations
        run: bundle exec rake db:migrate

      - name: Show the resulting schema diff
        run: git diff --stat db/schema.rb

      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: db/schema.rb
